[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "security-handbook"
version = "1.0.0"
description = "Enterprise Security Patterns & Practices: Cloud Perimeter Defense, DevSecOps, ETL/ELT Governance, Databricks Unity Catalog, ADF, Python Cryptography, OIDC Workload Identity & Deployments."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Santosh Jammi"}
]
keywords = ["security", "cloud-security", "devsecops", "data-engineering", "databricks", "unity-catalog", "zero-trust", "iam", "cryptography"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
